# Render Blueprint for NeoSense-AI: deploys BOTH frontend + backend together.
#
# Usage: push to GitHub, then in Render dashboard go to
# "Blueprints" -> "New Blueprint Instance" and select this repo.
# One click provisions both services below.
#
# Result:
#   - https://neosense-frontend.onrender.com   (React static site, free)
#   - https://neosense-backend.onrender.com    (FastAPI + WebSocket, Starter)

services:
  # ---------- Backend (FastAPI + WebSocket) ----------
  - type: web
    name: neosense-backend
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: >-
      python backend/bootstrap.py &&
      cd backend &&
      uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: NEOSENSE_DATASET_DIR
        value: /var/data/picsdb
      - key: NEOSENSE_ALLOWED_ORIGINS
        value: https://neosense-frontend.onrender.com
    disk:
      name: picsdb
      mountPath: /var/data
      sizeGB: 4

  # ---------- Frontend (React + Vite static site, FREE) ----------
  - type: web
    name: neosense-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_NEOSENSE_WS_URL
        value: wss://neosense-backend.onrender.com/ws/nicu
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
